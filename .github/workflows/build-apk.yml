
name: Build FloatingSFX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Android project
        run: |
          echo "Mencari settings.gradle..."
          find . -type f \( -name settings.gradle -o -name settings.gradle.kts \)

      - name: Build debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)")
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/build.gradle" -a ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "Project Gradle tidak ditemukan."
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatingSFX-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
